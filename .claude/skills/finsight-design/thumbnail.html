<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;width:1280px;height:854px;overflow:hidden}
.tile{display:grid;grid-template-columns:1fr 320px;width:1280px;height:854px}
.main{background:var(--color-primary);display:flex;align-items:center;justify-content:center}
.mark{font-family:var(--font-display);font-weight:400;font-size:150px;letter-spacing:-.04em;color:#fff;line-height:1;white-space:nowrap}
.strip{display:grid;grid-template-rows:repeat(4,1fr)}</style></head>
<body><div class="tile"><div class="main"><span class="mark">finsight</span></div>
<div class="strip"><div style="background:#f4b000"></div><div style="background:#05b169"></div><div style="background:#cf202f"></div><div style="background:#0a0b0d"></div></div></div></body></html>
