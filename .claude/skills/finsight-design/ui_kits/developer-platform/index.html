<!doctype html><html><head><meta charset="utf-8"><title>finsight developer platform — UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0}</style></head>
<body><div id="root"></div>
<script type="text/babel" src="pricing.screen.jsx"></script>
<script type="text/babel" src="keys.screen.jsx"></script>
<script type="text/babel" data-presets="react">
function Kit(){
  const [screen,setScreen]=React.useState('pricing');
  const go=(l)=>{if(l==='Developers')return setScreen('pricing');if(l==='Businesses')return setScreen('keys');};
  return (<div>
    {screen==='pricing' && <PricingScreen onNavigate={go} onGo={setScreen}/>}
    {screen==='keys' && <KeysScreen onNavigate={go} onGo={setScreen}/>}
    <div style={{position:'fixed',bottom:16,left:'50%',transform:'translateX(-50%)',display:'flex',gap:8,background:'var(--color-surface-dark)',padding:8,borderRadius:'var(--radius-pill)',zIndex:50}}>
      <button onClick={()=>setScreen('pricing')} style={{height:32,padding:'0 14px',border:'none',borderRadius:'var(--radius-pill)',cursor:'pointer',fontFamily:'var(--font-sans)',fontSize:13,fontWeight:600,background:screen==='pricing'?'var(--color-primary)':'transparent',color:'#fff'}}>Pricing</button>
      <button onClick={()=>setScreen('keys')} style={{height:32,padding:'0 14px',border:'none',borderRadius:'var(--radius-pill)',cursor:'pointer',fontFamily:'var(--font-sans)',fontSize:13,fontWeight:600,background:screen==='keys'?'var(--color-primary)':'transparent',color:'#fff'}}>API keys</button>
    </div>
  </div>);
}
const boot=()=>{ if(window.PricingScreen) ReactDOM.createRoot(document.getElementById('root')).render(<Kit/>); else setTimeout(boot,30); };
boot();
</script></body></html>
