<!-- @dsCard group="Shape" viewport="700x190" name="Elevation" subtitle="Flat, hairline, one soft shadow tier. That is all." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;font-family:var(--font-sans);color:var(--color-ink)}
.row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.sw{display:flex;flexDirection:column}
.chip{display:flex;flex-direction:column;gap:6px;min-width:104px}
.plate{height:56px;border-radius:var(--radius-md)}
.nm{font-size:12px;font-weight:600;color:var(--color-ink)}
.hx{font-family:var(--font-mono);font-size:11px;color:var(--color-muted)}
.tok{font-family:var(--font-mono);font-size:11px;color:var(--color-muted)}
</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;background:var(--color-surface-soft);padding:24px;border-radius:var(--radius-lg)">
<div style="background:#fff;border-radius:var(--radius-xl);padding:20px;font-size:13px;color:var(--color-muted)">Flat<br><span class="tok">no shadow</span></div>
<div style="background:#fff;border:1px solid var(--color-hairline);border-radius:var(--radius-xl);padding:20px;font-size:13px;color:var(--color-muted)">Hairline<br><span class="tok">1px --color-hairline</span></div>
<div style="background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.04);border-radius:var(--radius-xl);padding:20px;font-size:13px;color:var(--color-muted)">Soft drop<br><span class="tok">--shadow-soft</span></div></div></body></html>
