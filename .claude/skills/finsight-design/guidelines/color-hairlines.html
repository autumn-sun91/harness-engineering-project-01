<!-- @dsCard group="Colors" viewport="700x150" name="Hairlines" subtitle="1px dividers — the only border treatment" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;font-family:var(--font-sans);color:var(--color-ink)}
.row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.sw{display:flex;flexDirection:column}
.chip{display:flex;flex-direction:column;gap:6px;min-width:104px}
.plate{height:56px;border-radius:var(--radius-md)}
.nm{font-size:12px;font-weight:600;color:var(--color-ink)}
.hx{font-family:var(--font-mono);font-size:11px;color:var(--color-muted)}
.tok{font-family:var(--font-mono);font-size:11px;color:var(--color-muted)}
</style></head><body><div style="display:flex;flex-direction:column;gap:14px">
<div style="border-top:1px solid var(--color-hairline);padding-top:8px"><span class="nm">Hairline</span> <span class="tok">--color-hairline #dee1e6</span></div>
<div style="border-top:1px solid var(--color-hairline-soft);padding-top:8px"><span class="nm">Hairline Soft</span> <span class="tok">--color-hairline-soft #eef0f3</span></div></div></body></html>
