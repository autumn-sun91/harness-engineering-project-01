<!-- @dsCard group="Colors" viewport="700x210" name="Text" subtitle="Ink, body, muted — cool greys only" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;font-family:var(--font-sans);color:var(--color-ink)}
.row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.sw{display:flex;flexDirection:column}
.chip{display:flex;flex-direction:column;gap:6px;min-width:104px}
.plate{height:56px;border-radius:var(--radius-md)}
.nm{font-size:12px;font-weight:600;color:var(--color-ink)}
.hx{font-family:var(--font-mono);font-size:11px;color:var(--color-muted)}
.tok{font-family:var(--font-mono);font-size:11px;color:var(--color-muted)}
</style></head><body><div style="display:flex;flex-direction:column;gap:10px">
<div style="font-size:18px;font-weight:600;color:var(--color-ink)">Ink · headings and nav <span class="tok">--color-ink #0a0b0d</span></div>
<div style="font-size:16px;color:var(--color-body)">Body · default running text <span class="tok">--color-body #5b616e</span></div>
<div style="font-size:14px;color:var(--color-muted)">Muted · sub-titles and breadcrumbs <span class="tok">--color-muted #7c828a</span></div>
<div style="font-size:14px;color:var(--color-muted-soft)">Muted Soft · disabled link text <span class="tok">--color-muted-soft #a8acb3</span></div>
<div style="background:#0a0b0d;border-radius:var(--radius-md);padding:12px 16px;display:flex;flex-direction:column;gap:6px">
<span style="font-size:16px;color:var(--color-on-dark)">On Dark <span class="tok" style="color:#7c828a">--color-on-dark #ffffff</span></span>
<span style="font-size:14px;color:var(--color-on-dark-soft)">On Dark Soft <span class="tok" style="color:#7c828a">--color-on-dark-soft #a8acb3</span></span></div></div></body></html>
