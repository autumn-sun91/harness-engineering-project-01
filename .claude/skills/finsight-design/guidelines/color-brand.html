<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;font-family:var(--font-sans);color:var(--color-ink)}
.row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.sw{display:flex;flexDirection:column}
.chip{display:flex;flex-direction:column;gap:6px;min-width:104px}
.plate{height:56px;border-radius:var(--radius-md)}
.nm{font-size:12px;font-weight:600;color:var(--color-ink)}
.hx{font-family:var(--font-mono);font-size:11px;color:var(--color-muted)}
.tok{font-family:var(--font-mono);font-size:11px;color:var(--color-muted)}
</style></head><body><div class="row"><div class="chip"><div class="plate" style="background:#0052ff;"></div><span class="nm">Finsight Blue</span><span class="hx">#0052ff</span><span class="tok">--color-primary</span></div><div class="chip"><div class="plate" style="background:#003ecc;"></div><span class="nm">Blue Active</span><span class="hx">#003ecc</span><span class="tok">--color-primary-active</span></div><div class="chip"><div class="plate" style="background:#a8b8cc;"></div><span class="nm">Blue Disabled</span><span class="hx">#a8b8cc</span><span class="tok">--color-primary-disabled</span></div><div class="chip"><div class="plate" style="background:#f4b000;"></div><span class="nm">Accent Yellow</span><span class="hx">#f4b000</span><span class="tok">--color-accent-yellow</span></div></div></body></html>
