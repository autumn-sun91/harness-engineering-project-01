<!-- @dsCard group="Shape" viewport="700x200" name="Radius scale" subtitle="Pill for interactive, 24px for containers, circle for glyphs" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;font-family:var(--font-sans);color:var(--color-ink)}
.row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.sw{display:flex;flexDirection:column}
.chip{display:flex;flex-direction:column;gap:6px;min-width:104px}
.plate{height:56px;border-radius:var(--radius-md)}
.nm{font-size:12px;font-weight:600;color:var(--color-ink)}
.hx{font-family:var(--font-mono);font-size:11px;color:var(--color-muted)}
.tok{font-family:var(--font-mono);font-size:11px;color:var(--color-muted)}
</style></head><body><div class="row"><div class="chip"><div style="height:56px;background:var(--color-surface-strong);border-radius:4px"></div><span class="nm">xs</span><span class="hx">4px</span></div><div class="chip"><div style="height:56px;background:var(--color-surface-strong);border-radius:8px"></div><span class="nm">sm</span><span class="hx">8px</span></div><div class="chip"><div style="height:56px;background:var(--color-surface-strong);border-radius:12px"></div><span class="nm">md</span><span class="hx">12px</span></div><div class="chip"><div style="height:56px;background:var(--color-surface-strong);border-radius:16px"></div><span class="nm">lg</span><span class="hx">16px</span></div><div class="chip"><div style="height:56px;background:var(--color-surface-strong);border-radius:24px"></div><span class="nm">xl</span><span class="hx">24px</span></div><div class="chip"><div style="height:56px;background:var(--color-surface-strong);border-radius:100px"></div><span class="nm">pill</span><span class="hx">100px</span></div>
<div class="chip"><div style="height:56px;width:56px;background:var(--color-surface-strong);border-radius:9999px"></div><span class="nm">full</span><span class="hx">9999px</span></div></div></body></html>
