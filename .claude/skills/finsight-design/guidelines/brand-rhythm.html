<!-- @dsCard group="Brand" viewport="700x220" name="Band rhythm" subtitle="White → soft grey → full-bleed dark, repeating" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;font-family:var(--font-sans);color:var(--color-ink)}
.row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.sw{display:flex;flexDirection:column}
.chip{display:flex;flex-direction:column;gap:6px;min-width:104px}
.plate{height:56px;border-radius:var(--radius-md)}
.nm{font-size:12px;font-weight:600;color:var(--color-ink)}
.hx{font-family:var(--font-mono);font-size:11px;color:var(--color-muted)}
.tok{font-family:var(--font-mono);font-size:11px;color:var(--color-muted)}
</style></head><body><div style="border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--color-hairline)">
<div style="background:#fff;padding:22px 18px;font-size:13px;color:var(--color-muted)">white editorial band <span class="tok">--color-canvas</span></div>
<div style="background:var(--color-surface-soft);padding:22px 18px;font-size:13px;color:var(--color-muted)">soft grey elevation band <span class="tok">--color-surface-soft</span></div>
<div style="background:var(--color-surface-dark);padding:22px 18px;font-size:13px;color:var(--color-on-dark-soft)">full-bleed dark hero — always carries layered product-UI cards <span class="tok" style="color:#5b616e">--color-surface-dark</span></div>
<div style="background:#fff;padding:22px 18px;font-size:13px;color:var(--color-muted)">white again</div></div></body></html>
