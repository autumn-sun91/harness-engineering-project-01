<!-- @dsCard group="Colors" viewport="700x170" name="Trading semantics" subtitle="Green and red are text colours — never fills" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;font-family:var(--font-sans);color:var(--color-ink)}
.row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.sw{display:flex;flexDirection:column}
.chip{display:flex;flex-direction:column;gap:6px;min-width:104px}
.plate{height:56px;border-radius:var(--radius-md)}
.nm{font-size:12px;font-weight:600;color:var(--color-ink)}
.hx{font-family:var(--font-mono);font-size:11px;color:var(--color-muted)}
.tok{font-family:var(--font-mono);font-size:11px;color:var(--color-muted)}
</style></head><body><div style="display:flex;gap:40px;align-items:center">
<div style="display:flex;flex-direction:column;gap:8px">
<span style="font-family:var(--font-mono);font-size:18px;font-weight:500;color:var(--color-semantic-up)">+2.41%</span>
<span style="font-family:var(--font-mono);font-size:18px;font-weight:500;color:var(--color-semantic-down)">-0.87%</span>
<span class="tok">--color-semantic-up / -down</span></div>
<div style="display:flex;gap:16px"><div class="chip"><div class="plate" style="background:#05b169;"></div><span class="nm">Up</span><span class="hx">#05b169</span><span class="tok">--color-semantic-up</span></div><div class="chip"><div class="plate" style="background:#cf202f;"></div><span class="nm">Down</span><span class="hx">#cf202f</span><span class="tok">--color-semantic-down</span></div></div>
<div style="max-width:220px;font-size:13px;color:var(--color-muted)">Never a button background, never a filled chip. Colour on text only.</div></div></body></html>
