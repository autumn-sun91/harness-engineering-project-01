<!-- @dsCard group="Brand" viewport="700x170" name="Font substitution" subtitle="Licensed faces missing — Inter and JetBrains Mono stand in" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;font-family:var(--font-sans);color:var(--color-ink)}
.row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.sw{display:flex;flexDirection:column}
.chip{display:flex;flex-direction:column;gap:6px;min-width:104px}
.plate{height:56px;border-radius:var(--radius-md)}
.nm{font-size:12px;font-weight:600;color:var(--color-ink)}
.hx{font-family:var(--font-mono);font-size:11px;color:var(--color-muted)}
.tok{font-family:var(--font-mono);font-size:11px;color:var(--color-muted)}
</style></head><body><div style="display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--color-body)">
<div><b style="color:var(--color-ink)">Finsight Display</b> → <span style="font-family:var(--font-display)">Inter 400, tracking -1.5%</span></div>
<div><b style="color:var(--color-ink)">Finsight Sans</b> → <span style="font-family:var(--font-sans)">Inter 400 / 500 / 600 / 700</span></div>
<div><b style="color:var(--color-ink)">Finsight Mono</b> → <span style="font-family:var(--font-mono)">JetBrains Mono 500</span></div>
<div class="tok" style="margin-top:6px">Loaded from Google Fonts. Ship the licensed binaries to replace them.</div></div></body></html>
