<!-- @dsCard group="Colors" viewport="700x170" name="Surfaces" subtitle="White canvas, two grey bands, two dark canvases" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;font-family:var(--font-sans);color:var(--color-ink)}
.row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.sw{display:flex;flexDirection:column}
.chip{display:flex;flex-direction:column;gap:6px;min-width:104px}
.plate{height:56px;border-radius:var(--radius-md)}
.nm{font-size:12px;font-weight:600;color:var(--color-ink)}
.hx{font-family:var(--font-mono);font-size:11px;color:var(--color-muted)}
.tok{font-family:var(--font-mono);font-size:11px;color:var(--color-muted)}
</style></head><body><div class="row"><div class="chip"><div class="plate" style="background:#ffffff;border:1px solid var(--color-hairline)"></div><span class="nm">Canvas</span><span class="hx">#ffffff</span><span class="tok">--color-canvas</span></div><div class="chip"><div class="plate" style="background:#f7f7f7;border:1px solid var(--color-hairline)"></div><span class="nm">Surface Soft</span><span class="hx">#f7f7f7</span><span class="tok">--color-surface-soft</span></div><div class="chip"><div class="plate" style="background:#eef0f3;border:1px solid var(--color-hairline)"></div><span class="nm">Surface Strong</span><span class="hx">#eef0f3</span><span class="tok">--color-surface-strong</span></div><div class="chip"><div class="plate" style="background:#0a0b0d;"></div><span class="nm">Surface Dark</span><span class="hx">#0a0b0d</span><span class="tok">--color-surface-dark</span></div><div class="chip"><div class="plate" style="background:#16181c;"></div><span class="nm">Dark Elevated</span><span class="hx">#16181c</span><span class="tok">--color-surface-dark-elevated</span></div></div></body></html>
