<!-- @dsCard group="Spacing" viewport="700x260" name="Section rhythm" subtitle="96px between bands, 24px between cards, 32px inside them" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;font-family:var(--font-sans);color:var(--color-ink)}
.row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.sw{display:flex;flexDirection:column}
.chip{display:flex;flex-direction:column;gap:6px;min-width:104px}
.plate{height:56px;border-radius:var(--radius-md)}
.nm{font-size:12px;font-weight:600;color:var(--color-ink)}
.hx{font-family:var(--font-mono);font-size:11px;color:var(--color-muted)}
.tok{font-family:var(--font-mono);font-size:11px;color:var(--color-muted)}
</style></head><body><div style="border:1px dashed var(--color-hairline);border-radius:var(--radius-lg);overflow:hidden">
<div style="padding:24px;background:var(--color-canvas)"><span class="tok">band · padding 96px vertical in production</span>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;margin-top:12px">
<div style="border:1px solid var(--color-hairline);border-radius:var(--radius-xl);padding:32px 16px;text-align:center;font-size:12px;color:var(--color-muted)">card<br><span class="tok">pad 32</span></div><div style="border:1px solid var(--color-hairline);border-radius:var(--radius-xl);padding:32px 16px;text-align:center;font-size:12px;color:var(--color-muted)">card<br><span class="tok">pad 32</span></div><div style="border:1px solid var(--color-hairline);border-radius:var(--radius-xl);padding:32px 16px;text-align:center;font-size:12px;color:var(--color-muted)">card<br><span class="tok">pad 32</span></div></div>
<div class="tok" style="margin-top:12px">gap 24 between cards</div></div>
<div style="background:var(--color-surface-soft);padding:24px"><span class="tok">next band · surface-soft</span></div></div></body></html>
